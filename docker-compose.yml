services:
  arbis-ui:
    build: .
    container_name: arbis-streamlit
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${ARBIS_UI_PORT:-8501}:8501"
    volumes:
      - arbis-data:/app/data
    command: ["streamlit", "run", "app.py", "--server.address=0.0.0.0", "--server.port=8501", "--server.headless=true"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  arbis-worker:
    build: .
    container_name: arbis-paper-worker
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - arbis-data:/app/data
    command: ["python", "bot.py", "--interval", "${ARBIS_SCAN_INTERVAL:-5}", "--quantity", "${ARBIS_ORDER_QUANTITY:-0.001}", "--min-edge-pct", "${ARBIS_MIN_NET_EDGE_PCT:-0.10}"]
    depends_on:
      arbis-ui:
        condition: service_healthy

volumes:
  arbis-data:
